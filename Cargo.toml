[package]
name = "replica-agent"
version = "0.1.0"
edition = "2021"
authors = ["Replica Agent Contributors"]
description = "Autonomous clean-room agentic reverse-engineering and replica engine"

[lib]
name = "replica_agent"
path = "src/lib.rs"

[[bin]]
name = "replica-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
csv = "1.3"
regex = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
